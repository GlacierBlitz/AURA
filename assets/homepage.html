<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .homepage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .logo {
            max-width: 500px;
            width: 80%;
            height: auto;
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-in;
        }

        .welcome-text {
            font-size: 1rem;
            font-weight: 300;
            color: black;
            letter-spacing: 0.05em;
            text-align: center;
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .homepage-container {
                margin-right: 0;
            }

            .welcome-text {
                font-size: 2rem;
            }

            .logo {
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="homepage-container">
        <img src="logo.png" alt="AURA Logo" class="logo">
        <p class="welcome-text">Welcome to the web browser made for everyone.</p>
    </div>
</body>
</html>
